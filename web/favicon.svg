<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- tiny MRE pouch, matching the site's product art -->
  <rect x="4.5" y="2" width="23" height="28" rx="2.5" fill="#b3a380"/>
  <!-- heat-seal crimp band -->
  <rect x="4.5" y="2" width="23" height="5.5" rx="2.5" fill="#a08f6b"/>
  <g stroke="#8a7a58" stroke-width="1">
    <line x1="8" y1="2.5" x2="8" y2="7"/>
    <line x1="11" y1="2.5" x2="11" y2="7"/>
    <line x1="14" y1="2.5" x2="14" y2="7"/>
    <line x1="17" y1="2.5" x2="17" y2="7"/>
    <line x1="20" y1="2.5" x2="20" y2="7"/>
    <line x1="23" y1="2.5" x2="23" y2="7"/>
  </g>
  <line x1="4.5" y1="7.5" x2="27.5" y2="7.5" stroke="#71633f" stroke-width=".8" stroke-dasharray="1.6 1.2"/>
  <!-- label -->
  <rect x="8" y="10.5" width="16" height="1.8" rx=".9" fill="#453a22" opacity=".55"/>
  <text x="16" y="22.5" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-size="8.4" font-weight="900"
        fill="#453a22">MRE</text>
  <rect x="10" y="25" width="12" height="1.6" rx=".8" fill="#453a22" opacity=".4"/>
</svg>
